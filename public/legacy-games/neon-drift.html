<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Monet Drift — Night Arcade Racer</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #05050a; color: #fff; font-family: 'Orbitron', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }
  .ui { text-align: center; padding: 8px 12px; width: 100%; max-width: 1000px; }
  h1 { margin: 4px 0; font-size: 26px; color: #00f0ff; text-shadow: 0 0 12px #00f0ff; }
  .credits { color: #ffd700; font-size: 16px; margin: 2px 0; }
  .controls { font-size: 11px; color: #888; margin: 4px 0 8px; }
  button { background: #00f0ff; color: #000; border: none; padding: 10px 22px; font-family: inherit; font-weight: 800; border-radius: 8px; cursor: pointer; margin: 4px; }
  button:hover { filter: brightness(1.15); }
  #status { font-size: 14px; color: #ffd700; }
  canvas { border: 2px solid #00f0ff; background: #0a0a14; max-width: 100%; touch-action: none; }
  .touch { display: none; position: fixed; bottom: 30px; width: 100%; justify-content: space-between; padding: 0 30px; z-index: 10; }
  @media (pointer: coarse) { .touch { display: flex; } }
  .pad { width: 90px; height: 90px; background: rgba(0,240,255,0.15); border: 2px solid #00f0ff; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; user-select: none; }
</style>
</head>
<body>
<div class="ui">
  <h1>NEON DRIFT</h1>
  <div class="credits" id="credits">3,500 cr</div>
  <div class="controls">Arrow keys / A-D = Steer &nbsp;|&nbsp; Up / W = Gas &nbsp;|&nbsp; Down / S = Brake &nbsp;|&nbsp; Mobile: drag left pad</div>
  <button id="startBtn" onclick="startRace()">Start Race</button>
  <div id="status">Harbor Circuit · Monarch Coupe</div>
</div>
<canvas id="race" width="900" height="500"></canvas>
<div class="touch">
  <div class="pad" id="steerPad">◀ ▶</div>
  <div class="pad" id="brake">■</div>
</div>
<script>
const canvas = document.getElementById('race');
const ctx = canvas.getContext('2d');
const W = 900, H = 500;
let racing = false, distance = 0, speed = 0, credits = 3500, bestDist = +localStorage.getItem('driftBest') || 0;
let trackIndex = 0;
const tracks = ['Harbor Circuit', 'Elevated Loop', 'Cliff Road'];
const car = { x: 400, y: 380, w: 36, h: 64, angle: 0, steer: 0 };
let roadOffset = 0, obstacles = [], particles = [];

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Touch steering
let touchSteer = 0;
const steerPad = document.getElementById('steerPad');
steerPad.addEventListener('touchstart', handleSteer);
steerPad.addEventListener('touchmove', handleSteer);
steerPad.addEventListener('touchend', () => touchSteer = 0);
function handleSteer(e) {
  e.preventDefault();
  const rect = steerPad.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;
  touchSteer = (x / rect.width - 0.5) * 2;
}
document.getElementById('brake').addEventListener('touchstart', e => { e.preventDefault(); keys['s'] = true; });
document.getElementById('brake').addEventListener('touchend', () => keys['s'] = false);

function startRace() {
  racing = true;
  distance = 0;
  speed = 0;
  car.x = 400;
  car.angle = 0;
  obstacles = [];
  particles = [];
  for (let i = 0; i < 8; i++) obstacles.push(makeObstacle());
  document.getElementById('startBtn').style.display = 'none';
  loop();
}

function makeObstacle() {
  return { x: 200 + Math.random() * 500, y: -100 - Math.random() * 400, w: 40 + Math.random()*30, h: 20, type: Math.random() > 0.7 ? 'barrier' : 'cone' };
}

function update() {
  // Gas / brake
  if (keys['arrowup'] || keys['w']) speed = Math.min(speed + 0.15, 12);
  else if (keys['arrowdown'] || keys['s']) speed = Math.max(speed - 0.3, 0);
  else speed *= 0.985; // coast

  // Steer
  let steerInput = 0;
  if (keys['arrowleft'] || keys['a']) steerInput = -1;
  if (keys['arrowright'] || keys['d']) steerInput = 1;
  steerInput += touchSteer;
  car.angle += steerInput * 0.04 * (speed / 6);
  car.x += Math.sin(car.angle) * speed * 0.8;
  if (car.x < 180) car.x = 180;
  if (car.x > 720) car.x = 720;

  roadOffset += speed;
  distance += speed * 0.1;

  // Obstacles
  obstacles.forEach(o => {
    o.y += speed;
    if (o.y > H + 50) {
      o.y = -80;
      o.x = 200 + Math.random() * 500;
    }
    // Collision
    if (o.y > car.y - 20 && o.y < car.y + car.h && Math.abs(o.x - car.x) < 30) {
      speed *= 0.4;
      credits = Math.max(0, credits - 50);
      particles.push({ x: car.x, y: car.y, life: 20 });
    }
  });

  particles = particles.filter(p => --p.life > 0);

  if (Math.floor(distance) % 500 === 0 && Math.floor(distance) > 0) {
    trackIndex = (trackIndex + 1) % tracks.length;
    credits += 200;
  }

  document.getElementById('credits').textContent = credits.toLocaleString() + ' cr';
  document.getElementById('status').textContent = `${tracks[trackIndex]} · Dist: ${Math.floor(distance)}m · Speed: ${Math.floor(speed*10)} · Best: ${Math.max(bestDist, Math.floor(distance))}m`;
  if (distance > bestDist) { bestDist = Math.floor(distance); localStorage.setItem('driftBest', bestDist); }
}

function draw() {
  // Night sky + wet road
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#0a0520');
  grd.addColorStop(1, '#1a1030');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // Road
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(150, 0, 600, H);
  // Wet lines
  ctx.strokeStyle = '#00f0ff44';
  ctx.lineWidth = 2;
  for (let y = (roadOffset % 40) - 40; y < H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(450, y);
    ctx.lineTo(450, y + 20);
    ctx.stroke();
  }
  // Side glow
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(150, 0); ctx.lineTo(150, H);
  ctx.moveTo(750, 0); ctx.lineTo(750, H);
  ctx.stroke();

  // Obstacles
  obstacles.forEach(o => {
    ctx.fillStyle = o.type === 'barrier' ? '#ff4444' : '#ffaa00';
    ctx.fillRect(o.x - o.w/2, o.y, o.w, o.h);
  });

  // Particles
  particles.forEach(p => {
    ctx.fillStyle = `rgba(0,240,255,${p.life/20})`;
    ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
  });

  // Car (black widebody with cyan underglow + crown)
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle * 0.5);
  // Underglow
  ctx.fillStyle = '#00f0ff88';
  ctx.fillRect(-22, 10, 44, 8);
  // Body
  ctx.fillStyle = '#111';
  ctx.fillRect(-18, -30, 36, 60);
  // Roof / wing
  ctx.fillStyle = '#222';
  ctx.fillRect(-14, -28, 28, 18);
  // Crown mark
  ctx.fillStyle = '#ffd700';
  ctx.font = '14px Orbitron';
  ctx.fillText('👑', -7, -10);
  // Lights
  ctx.fillStyle = '#00f0ff';
  ctx.fillRect(-12, 24, 6, 4);
  ctx.fillRect(6, 24, 6, 4);
  ctx.restore();

  // City towers silhouette
  ctx.fillStyle = '#0a0a18';
  for (let i = 0; i < 6; i++) {
    const tx = 40 + i * 140;
    const th = 80 + (i % 3) * 40;
    ctx.fillRect(tx, H - th, 50, th);
  }
}

function loop() {
  if (!racing) return;
  update();
  draw();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
